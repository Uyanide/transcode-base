[avif.oavif]
requires = "oavif"
command = [
    "oavif",
    "-s",
    "{{ speed }}",       # 0 (slowest) to 10 (fastest)
    "-t",
    "{{ quality }}",     # 0 to 100
    "{{ input_path }}",
    "{{ output_path }}",
]
args = { speed = "3", quality = "80" }

[avif.magick]
requires = "magick"
command = [
    "magick",
    "{{ input_path }}",
    "-define",
    "heic:speed={{ speed }}", # 0 (slowest) to 10 (fastest)
    "-quality",
    "{{ quality }}",          # 0 to 100
    "{{ output_path }}",
]
args = { speed = "2", quality = "80" }

[webp.magick]
requires = "magick"
command = [
    "magick",
    "{{ input_path }}",
    "-define",
    "webp:method={{ speed }}", # 0 (fastest) to 6 (slowest)
    "-quality",
    "{{ quality }}",           # 0 to 100
    "{{ output_path }}",
]
args = { speed = "6", quality = "80" }

[avif.ffmpeg]
requires = "ffmpeg"
command = [
    "ffmpeg",
    "-hide_banner",
    "-y",
    "-i",
    "{{ input_path }}",
    "-c:v",
    "libaom-av1",
    "-cpu-used",
    "{{ speed }}",       # 0 (slowest) to 10 (fastest)
    "-b:v",
    "0",
    "-crf",
    "{{ quality }}",     # 0 (best) to 63 (worst)
    "-pix_fmt",
    "yuv420p10le",
    "-still-picture",
    "1",
    "-aomav1-params",
    "tune=iq",
    "{{ output_path }}",
]
args = { speed = "1", quality = "20" }

[avif.avifenc]
requires = "avifenc"
command = [
    "avifenc",
    "--codec",
    "aom",
    "--speed",
    "{{ speed }}",   # 0 (slowest) to 10 (fastest)
    "--jobs",
    "all",
    "--depth",
    "10",
    "--yuv",
    "444",
    "--qcolor",
    "{{ quality }}", # 0 to 100
    "--advanced",
    "tune=iq",
    # "--advanced",
    # "color:enable-chroma-deltaq=1",
    # "--advanced",
    # "color:deltaq-mode=6",
]
args = { speed = "1", quality = "75" }
