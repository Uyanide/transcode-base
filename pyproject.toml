[project]
name            = "transcode-base"
version         = "0.1.0"
description     = "Task-style Python API and CLI scripts wrapping encoders and quality metrics."
readme          = "README.md"
requires-python = ">=3.13"
dependencies    = ["attrs>=26.1.0"]

[dependency-groups]
dev = ["pyright>=1.1.409", "ruff>=0.15.13"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcode_base"]

[tool.ruff]
line-length    = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
include       = ["src"]
