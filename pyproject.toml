[project]
name            = "transcode-base"
version         = "0.1.1"
description     = "Profiles-based wrappers for video / audio / image encoding and quality measurement."
readme          = "README.md"
requires-python = ">=3.13"
dependencies    = ["attrs>=26.1.0"]

[project.scripts]
tb-av     = "transcode_base.cli.av1an:main"
tb-ff     = "transcode_base.cli.ffmpeg:main"
tb-img    = "transcode_base.cli.image:main"
tb-imgs   = "transcode_base.cli.images:main"
tb-sample = "transcode_base.cli.sample:main"
tb-metric = "transcode_base.cli.metric:main"

[dependency-groups]
dev = ["pyright>=1.1.409", "ruff>=0.15.13"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcode_base"]

[tool.ruff]
line-length    = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
include       = ["src"]
